[package]
name = "runout-app"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Runout desktop app"

[[bin]]
name = "runout-app"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
runout-engine = { path = "../engine" }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cpal = "0.18"
# Direct hw: capture for S/PDIF, bypassing PipeWire. Both are already in the
# tree under cpal; alsa-sys is used for the IEC958 status alsa does not wrap.
alsa = "0.11"
alsa-sys = "0.4"
hound = "3"
rayon = "1"
ureq = { version = "3", features = ["json"] }
ebur128 = "0.1"
