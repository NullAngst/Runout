[package]
name = "runout-engine"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "DSP, project model and file I/O for Runout"

[lib]
name = "runout_engine"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
symphonia = { version = "0.6", features = ["all"] }
hound = "3"
flacenc = "0.5"
lofty = "0.25"
rustfft = "6"
realfft = "3"
ebur128 = "0.1"
rayon = "1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
memmap2 = "0.9"

[dev-dependencies]
sha2 = "0.10"
